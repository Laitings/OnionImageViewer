# Builds the Windows installer and attaches it to a GitHub release.
#
# Runs when a release is published (Releases > Draft a new release > Publish). The tag becomes the
# installer's version: tag v1.2.0 gives OnionImageViewer-Setup-1.2.0.exe on that release.
# It can also be started by hand (Actions > Release installer > Run workflow), and it runs on pull
# requests that touch the installer; those runs keep the setup .exe as a workflow artifact only.
name: Release installer

on:
  release:
    types: [published]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release-installer.yml
      - installer/**

permissions:
  contents: write

concurrency:
  group: release-installer-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: "6.11.1"   # same Qt as the work PC
  VCPKG_ROOT: ${{ github.workspace }}\vcpkg
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-cache

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Qt
        id: qt-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\Qt
          key: qt-${{ runner.os }}-${{ env.QT_VERSION }}-msvc-imageformats

      # aqtinstall straight from pip, picking whichever 64-bit MSVC build the Qt version offers.
      - name: Install Qt
        shell: pwsh
        run: |
          python -m pip install --quiet --upgrade aqtinstall
          $archs = (python -m aqt list-qt windows desktop --arch $env:QT_VERSION) -split '\s+' | Where-Object { $_ }
          Write-Host "Qt $env:QT_VERSION architectures: $($archs -join ', ')"
          $arch = $archs | Where-Object { $_ -match '^win64_msvc\d+_64$' } | Sort-Object -Descending | Select-Object -First 1
          if (-not $arch) { throw "No 64-bit MSVC build of Qt $env:QT_VERSION" }
          Write-Host "Modules: $((python -m aqt list-qt windows desktop --modules $env:QT_VERSION $arch) -join ' ')"
          if ("${{ steps.qt-cache.outputs.cache-hit }}" -ne "true") {
            python -m aqt install-qt windows desktop $env:QT_VERSION $arch --outputdir "${{ github.workspace }}\Qt" --modules qtimageformats
            if ($LASTEXITCODE -ne 0) { throw "aqt install-qt failed" }
          }
          $qtDir = Get-ChildItem "${{ github.workspace }}\Qt\$env:QT_VERSION" -Directory | Where-Object { Test-Path (Join-Path $_.FullName "bin\windeployqt.exe") } | Select-Object -First 1
          if (-not $qtDir) { throw "Qt was not installed where expected" }
          "QT_ROOT_DIR=$($qtDir.FullName)" >> $env:GITHUB_ENV
          Write-Host "Qt: $($qtDir.FullName)"

      # vcpkg checked out in full, so the builtin-baseline pinned in vcpkg.json resolves.
      - name: Set up vcpkg
        shell: pwsh
        run: |
          git clone --quiet https://github.com/microsoft/vcpkg "$env:VCPKG_ROOT"
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          New-Item -ItemType Directory -Force "$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-Null

      - name: Cache vcpkg packages (OpenEXR)
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Install Inno Setup and Ninja if missing
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y --no-progress }

      - name: Work out the version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "release") {
            $v = "${{ github.event.release.tag_name }}" -replace '^[vV]', ''
          } else {
            $cmake = Get-Content CMakeLists.txt -Raw
            if ($cmake -notmatch 'project\(OnionImageViewer\s+VERSION\s+([0-9.]+)') { throw "No VERSION in CMakeLists.txt" }
            $v = "$($matches[1])-dev.${{ github.run_number }}"
          }
          if ($v -notmatch '^[0-9A-Za-z.\-+]+$') { throw "Tag '$v' can't be used as a version." }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $v"

      - name: Build the app and the installer
        shell: pwsh
        run: >
          ./installer/build-installer.ps1
          -QtDir "$env:QT_ROOT_DIR"
          -ArriLutDir ""
          -Version "${{ steps.version.outputs.version }}"

      - name: Keep the installer as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: OnionImageViewer-Setup-${{ steps.version.outputs.version }}
          path: installer/Output/OnionImageViewer-Setup-${{ steps.version.outputs.version }}.exe
          if-no-files-found: error

      - name: Attach the installer to the release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release upload "${{ github.event.release.tag_name }}"
          "installer/Output/OnionImageViewer-Setup-${{ steps.version.outputs.version }}.exe"
          --clobber --repo "${{ github.repository }}"
