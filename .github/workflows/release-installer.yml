# Builds the Windows installer and attaches it to a GitHub release.
#
# Runs when a release is published (Releases > Draft a new release > Publish). The tag becomes the
# installer's version: tag v1.2.0 gives OnionImageViewer-Setup-1.2.0.exe on that release.
# It can also be started by hand (Actions > Release installer > Run workflow), and it runs on pull
# requests that touch the installer; those runs keep the setup .exe as a workflow artifact only.
name: Release installer

on:
  release:
    types: [published]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release-installer.yml
      - installer/**
      - resources/luts/**
      - vcpkg.json
      - triplets/**

permissions:
  contents: write

concurrency:
  group: release-installer-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: "6.11.1"   # same Qt as the work PC
  VCPKG_ROOT: ${{ github.workspace }}\vcpkg
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-cache

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Cache Qt
        id: qt-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\Qt
          key: qt-${{ runner.os }}-${{ env.QT_VERSION }}-msvc2022_64-imageformats-pdf-v3

      # Qt 6.11's online repository is split per compiler (qt6_6111/qt6_6111_msvc2022_64/...),
      # which aqtinstall can't read yet, so the archives are fetched from Updates.xml directly and
      # checked against Qt's .sha1 files: qtbase, Qt Image Formats and the Qt PDF extension.
      - name: Install Qt
        if: steps.qt-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $v = $env:QT_VERSION; $vv = $v -replace '\.', ''
          $repo = "https://download.qt.io/online/qtsdkrepository/windows_x86"
          $sources = @(
            @{ Base = "$repo/desktop/qt6_$vv/qt6_${vv}_msvc2022_64"; Name = "qt.qt6.$vv.win64_msvc2022_64" },
            @{ Base = "$repo/desktop/qt6_$vv/qt6_${vv}_msvc2022_64"; Name = "qt.qt6.$vv.addons.qtimageformats.win64_msvc2022_64" },
            @{ Base = "$repo/extensions/qtpdf/$vv/msvc2022_64"; Name = "extensions.qtpdf.$vv.win64_msvc2022_64" }
          )
          $out = "${{ github.workspace }}\Qt"
          $dl = Join-Path $env:RUNNER_TEMP "qt-archives"
          New-Item -ItemType Directory -Force $out, $dl | Out-Null
          foreach ($source in $sources) {
            $base = $source.Base; $name = $source.Name
            $xmlFile = Join-Path $dl ("Updates-" + ($base -replace '[^A-Za-z0-9]', '_') + ".xml")
            if (-not (Test-Path $xmlFile)) { Invoke-WebRequest "$base/Updates.xml" -OutFile $xmlFile -UseBasicParsing }
            [xml]$updates = Get-Content $xmlFile -Raw
            $pkg = $updates.Updates.PackageUpdate | Where-Object { $_.Name -eq $name }
            if (-not $pkg) { throw "Package $name not in $base/Updates.xml" }
            foreach ($archive in ($pkg.DownloadableArchives -split ',\s*' | Where-Object { $_ })) {
              $file = "$($pkg.Version)$archive"
              $url = "$base/$name/$file"
              Write-Host "Downloading $file"
              Invoke-WebRequest $url -OutFile (Join-Path $dl $file) -UseBasicParsing
              Invoke-WebRequest "$url.sha1" -OutFile (Join-Path $dl "$file.sha1") -UseBasicParsing
              $expected = (Get-Content (Join-Path $dl "$file.sha1") -Raw).Trim().Split(' ')[0]
              $actual = (Get-FileHash (Join-Path $dl $file) -Algorithm SHA1).Hash
              if ($actual -ne $expected) { throw "Checksum mismatch for $file" }
              & 7z x -y -bso0 -bsp0 "-o$out" (Join-Path $dl $file)
              if ($LASTEXITCODE -ne 0) { throw "Extracting $file failed" }
            }
          }

      - name: Find Qt
        shell: pwsh
        run: |
          $deploy = Get-ChildItem "${{ github.workspace }}\Qt" -Recurse -Filter windeployqt.exe | Select-Object -First 1
          if (-not $deploy) { throw "windeployqt.exe not found under Qt" }
          $qtDir = $deploy.Directory.Parent.FullName
          # Same as aqtinstall/the Qt installer: let qmake/qtpaths find the install where it is.
          if (-not (Test-Path "$qtDir\bin\qt.conf")) { "[Paths]`nPrefix=.." | Set-Content "$qtDir\bin\qt.conf" }
          "QT_ROOT_DIR=$qtDir" >> $env:GITHUB_ENV
          Write-Host "Qt: $qtDir"
          Write-Host "Qt PDF: $(Test-Path "$qtDir\bin\Qt6Pdf.dll")"
          Get-ChildItem "$qtDir\plugins\imageformats" | ForEach-Object { Write-Host "  imageformats: $($_.Name)" }

      # vcpkg checked out in full, so the builtin-baseline pinned in vcpkg.json resolves.
      - name: Set up vcpkg
        shell: pwsh
        run: |
          git clone --quiet https://github.com/microsoft/vcpkg "$env:VCPKG_ROOT"
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          New-Item -ItemType Directory -Force "$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-Null

      # OpenEXR (static), libheif, libde265 and LibRaw (DLLs, see triplets/).
      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'triplets/**') }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Install Inno Setup and Ninja if missing
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y --no-progress }

      - name: Work out the version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "release") {
            $v = "${{ github.event.release.tag_name }}" -replace '^[vV]', ''
          } else {
            $cmake = Get-Content CMakeLists.txt -Raw
            if ($cmake -notmatch 'project\(OnionImageViewer\s+VERSION\s+([0-9.]+)') { throw "No VERSION in CMakeLists.txt" }
            $v = "$($matches[1])-dev.${{ github.run_number }}"
          }
          if ($v -notmatch '^[0-9A-Za-z.\-+]+$') { throw "Tag '$v' can't be used as a version." }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $v"

      - name: Build the app and the installer
        shell: pwsh
        run: >
          ./installer/build-installer.ps1
          -QtDir "$env:QT_ROOT_DIR"
          -Version "${{ steps.version.outputs.version }}"

      - name: Check HEIC and DNG support in the installer
        shell: pwsh
        run: |
          foreach ($file in "heif.dll", "libde265.dll", "raw_r.dll", "licenses\libheif.txt", "licenses\libde265.txt", "licenses\libraw.txt", "licenses\libjpeg-turbo.txt", "licenses\lcms.txt", "licenses\zlib.txt") {
            if (-not (Test-Path "installer\stage\$file")) { throw "$file is missing from installer\stage" }
          }
          Get-ChildItem installer\stage -Filter *.dll | ForEach-Object { Write-Host "  $($_.Name)" }

      - name: Keep the installer as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: OnionImageViewer-Setup-${{ steps.version.outputs.version }}
          path: installer/Output/OnionImageViewer-Setup-${{ steps.version.outputs.version }}.exe
          if-no-files-found: error

      - name: Attach the installer to the release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release upload "${{ github.event.release.tag_name }}"
          "installer/Output/OnionImageViewer-Setup-${{ steps.version.outputs.version }}.exe"
          --clobber --repo "${{ github.repository }}"
